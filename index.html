<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversion Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="widget">
      <h1>MM ↔ Inch Converter</h1>
      <p class="subtitle">Type in either box for live conversion.</p>

      <section class="converter" aria-label="Millimeter to inch conversion">
        <label for="mm-input">Millimeters (mm)</label>
        <input id="mm-input" type="text" inputmode="decimal" placeholder="e.g. 25.4" />

        <label for="inch-input">Inches (in)</label>
        <input
          id="inch-input"
          type="text"
          inputmode="text"
          placeholder="e.g. 1.25 or 1 1/4"
        />

        <div id="inch-display" class="hint" aria-live="polite">
          Inch display: decimal — | fraction —
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="calculator" aria-label="Quick calculator">
        <h2>Quick Calculator</h2>
        <label for="calc-input">Expression</label>
        <input id="calc-input" type="text" inputmode="text" placeholder="e.g. (12+5)*3/2" />
        <div id="calc-result" class="calc-result" aria-live="polite">Result: —</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
